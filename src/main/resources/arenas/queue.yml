# queue 房自己的等待规则与人数限制
settings:
  min-players: 4
  max-players: 20
  countdown-seconds: 120
  fast-countdown-seconds: 10
  fast-start-percent: 0.8
  seeker-ratio: 0.2
  preparation-time: 5
  game-duration: 600
  ai-animal-count: 0

allowed-animals: [ ]
allowed-monsters: [ ]

scoring:
  seeker-kill-hider: 10
  seeker-hit-hider: 5
  seeker-place-explosive-sheep: 7
  seeker-win-original: 20
  seeker-win-infected: 5
  hider-win: 20
  hider-survival-reward: 1
  hider-survival-interval: 15
  taunt-poop: 2
  taunt-stinky: 4
  taunt-scream: 7
  taunt-party: 10
  seeker-pickup-poop: 1

taunt-cooldowns:
  poop: 5
  stinky: 15
  scream: 30
  party: 50

taunt-heal:
  poop: 1.0
  stinky: 2.0
  scream: 3.0
  party: 4.0
